<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kaspi Clone</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#ececec;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* PHONE */

.phone{
    width:100%;
    max-width:390px;
    height:100vh;
    background:#fff;
    overflow-y:auto;
    overflow-x:hidden;
    position:relative;
}

/* HEADER */

.header{
    background:white;
    padding:14px 16px 12px;
}

.title{
    text-align:center;
    font-size:16px;
    font-weight:600;
    color:#222;
    margin-bottom:18px;
}

.lang{
    position:absolute;
    right:18px;
    top:15px;
    display:flex;
    align-items:center;
    gap:6px;
}

.lang span{
    font-size:15px;
    color:#666;
}

.lang .active{
    border:1px solid #e51f28;
    color:#e51f28;
    padding:4px 10px;
    border-radius:15px;
}

/* LINE */

.line{
    height:1px;
    background:#ece7e7;
    margin-bottom:18px;
}

/* PROFILE */

.profile{
    display:flex;
    align-items:center;
}

.avatar{
    width:54px;
    height:54px;
    border-radius:50%;
    border:1px solid #d7d7d7;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#9f9f9f;
    font-size:24px;
}

.profile-text{
    margin-left:14px;
}

.profile-text h3{
    font-size:18px;
    font-weight:500;
    color:#333;
}

.profile-text p{
    margin-top:4px;
    color:#999;
    font-size:13px;
}

.red-dot{
    margin-left:auto;
    width:9px;
    height:9px;
    border-radius:50%;
    background:#e51f28;
}

.arrow{
    margin-left:14px;
    color:#999;
    font-size:20px;
}

/* BLOCK */

.block{
    height:8px;
    background:#f1eeee;
}

/* SERVICES */

.services{
    background:white;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    row-gap:28px;
    padding:22px 8px 95px;
}

.service{
    text-align:center;
    position:relative;
    cursor:pointer;
    transition:0.15s;
}

.service:active{
    transform:scale(0.92);
}

.service p{
    margin-top:-6px;
    font-size:12px;
    color:#333;
    line-height:16px;
}

/* ICON IMG */

.icon-img{
    width:52px;
    height:52px;
    object-fit:contain;
}

/* NEW */

.new-badge{
    position:absolute;
    top:-4px;
    right:15px;
    background:#e51f28;
    color:white;
    font-size:8px;
    padding:2px 5px;
    border-radius:10px;
    font-weight:600;
}

/* PARTNERS */

.section{
    border-top:8px solid #f1eeee;
    background:white;
}

.section-title{
    padding:18px 16px;
    font-size:19px;
    font-weight:700;
    color:#222;
}

.partner{
    display:flex;
    align-items:center;
    padding:14px 16px;
    border-top:1px solid #f0f0f0;
}

.partner-logo{
    width:48px;
    height:48px;
    border-radius:12px;
    background:#f5f5f5;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
}

.partner-logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.partner-info{
    margin-left:14px;
    flex:1;
}

.partner-info h4{
    font-size:16px;
    font-weight:500;
    color:#333;
}

.partner-info p{
    font-size:12px;
    color:#888;
    margin-top:4px;
}

.green{
    background:#69bc45;
    color:white;
    font-size:10px;
    padding:3px 6px;
    border-radius:7px;
    margin-left:5px;
}

.partner-arrow{
    color:#b0b0b0;
    font-size:20px;
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;
    bottom:0;
    width:100%;
    max-width:390px;
    height:72px;
    background:white;
    border-top:1px solid #e8e8e8;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:999;
}

.nav-item{
    text-align:center;
    color:#8a8a8a;
    font-size:11px;
    cursor:pointer;
    transition:0.15s;
}

.nav-item:active{
    transform:scale(0.92);
}

.nav-item i{
    font-size:21px;
    margin-bottom:5px;
}

.nav-item.active{
    color:#e51f28;
}

</style>
</head>

<body>

<div class="phone">

    <!-- HEADER -->

    <div class="header">

        <div class="title">
            Сервисы
        </div>

        <div class="lang">
            <span>Қаз</span>
            <span class="active">Рус</span>
        </div>

        <div class="line"></div>

        <div class="profile">

            <div class="avatar">
                <i class="fa-regular fa-user"></i>
            </div>

            <div class="profile-text">
                <h3>Бауыржан У.</h3>
                <p>Настройки</p>
            </div>

            <div class="red-dot"></div>

            <div class="arrow">
                <i class="fa-solid fa-chevron-right"></i>
            </div>

        </div>

    </div>

    <div class="block"></div>

    <!-- SERVICES -->

    <div class="services">

        <div class="service">
            <img src="1.png" class="icon-img">
            <p>Магазин</p>
        </div>

        <div class="service">
            <img src="2.png" class="icon-img">
            <p>Мой Банк</p>
        </div>

        <div class="service">
            <img src="3.png" class="icon-img">
            <p>Платежи</p>
        </div>

        <div class="service">
            <img src="4.png" class="icon-img">
            <p>Переводы</p>
        </div>

        <div class="service">
            <img src="5.png" class="icon-img">
            <p>Акции</p>
        </div>

        <div class="service">
          
            <img src="6.png" class="icon-img">
            <p>Travel</p>
        </div>

        <div class="service">
            <img src="7.png" class="icon-img">
            <p>Госуслуги</p>
        </div>

        <div class="service">
            <img src="8.png" class="icon-img">
            <p>Объявления</p>
        </div>

        <div class="service">
            <img src="9.png" class="icon-img">
            <p>Гид</p>
        </div>

        <div class="service">
            <img src="10.png" class="icon-img">
            <p>Kaspi Maps</p>
        </div>

        <div class="service">
            <img src="11.png" class="icon-img">
            <p>Сертификаты</p>
        </div>

        <div class="service">
            <img src="12.png" class="icon-img">
            <p>Работа</p>
        </div>

        <div class="service">
            <img src="13.png" class="icon-img">
            <p>Kaspi Alaqan</p>
        </div>

    </div>

    <!-- PARTNERS -->

    <div class="section">

        <div class="section-title">
            Партнерские сервисы
        </div>

        <div class="partner">

            <div class="partner-logo">
                <img src="m.png">
            </div>

            <div class="partner-info">
                <h4>Magnum</h4>
                <p>Продукты с Бесплатной доставкой</p>
            </div>

            <div class="partner-arrow">
                <i class="fa-solid fa-chevron-right"></i>
            </div>

        </div>

        <div class="partner">

            <div class="partner-logo">
                <img src="g.png">
            </div>

            <div class="partner-info">
                <h4>
                    Glovo
                    <span class="green">10%</span>
                </h4>

                <p>Сервис доставки еды</p>
            </div>

            <div class="partner-arrow">
                <i class="fa-solid fa-chevron-right"></i>
            </div>

        </div>

    </div>

</div>

<!-- BOTTOM NAV -->

<div class="bottom-nav">

    <div class="nav-item">
        <i class="fa-solid fa-house"></i>
        <div>Главная</div>
    </div>

    <div class="nav-item">
        <i class="fa-solid fa-qrcode"></i>
        <div>Kaspi QR</div>
    </div>

    <div class="nav-item">
        <i class="fa-regular fa-comment"></i>
        <div>Сообщения</div>
    </div>

    <div class="nav-item active">
        <i class="fa-solid fa-bars"></i>
        <div>Сервисы</div>
    </div>

</div>

<script>

const services = document.querySelectorAll('.service');

services.forEach(service => {

    service.addEventListener('click', () => {

        service.style.opacity = "0.6";

        setTimeout(() => {
            service.style.opacity = "1";
        },150);

        console.log(service.innerText);

    });

});

const navItems = document.querySelectorAll('.nav-item');

navItems.forEach(item => {

    item.addEventListener('click', () => {

        navItems.forEach(el => {
            el.classList.remove('active');
        });

        item.classList.add('active');

    });

});

</script>

</body>
</html>
